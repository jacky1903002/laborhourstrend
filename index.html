<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Labor Hours Analytics Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800">

    <!-- 1. 登入畫面 (Firebase Email / Password) -->
    <div id="login-section" class="flex-grow flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900">
        <div class="bg-white/95 backdrop-blur p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 text-white rounded-xl font-bold text-xl mb-3 shadow-lg shadow-blue-500/30">LT</div>
                <h2 class="text-2xl font-bold text-slate-900">製造工時趨勢系統</h2>
                <p class="text-sm text-slate-500 mt-1">Enterprise Labor Hours Intelligence</p>
            </div>
            
            <div id="login-error" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg hidden"></div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-slate-700 text-xs font-semibold uppercase tracking-wider mb-1.5">電子郵件</label>
                    <input type="email" id="login-email" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="user@feedback.com.tw" value="n1693131@gmail.com">
                </div>
                <div>
                    <label class="block text-slate-700 text-xs font-semibold uppercase tracking-wider mb-1.5">密碼</label>
                    <input type="password" id="login-password" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-blue-600/20 text-sm">安全登入</button>
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase">或</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>
                <button onclick="handleDemoLogin()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-xl transition text-sm">快速演示登入 (略過驗證)</button>
            </div>
        </div>
    </div>

    <!-- 2. 主控台畫面 (登入後顯示) -->
    <div id="app-section" class="hidden flex-grow flex flex-col">
        <!-- 企業頂部導覽列 -->
        <header class="bg-slate-900 text-white shadow-md px-8 py-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center space-x-4">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-bold shadow">LT</div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">Enterprise Labor Hours Trend Analytics</h1>
                    <span id="last-update-time" class="text-xs text-slate-400 font-mono">最後更新: 載入中...</span>
                </div>
            </div>
            <div class="flex items-center space-x-6">
                <span id="user-display" class="text-sm text-slate-300 font-medium"></span>
                <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-red-400 text-sm px-3.5 py-1.5 rounded-xl transition border border-slate-700">登出系統</button>
            </div>
        </header>

        <!-- 主要內容區 -->
        <main class="flex-grow p-8 max-w-7xl mx-auto w-full space-y-6">
            <!-- 工具列與操作區 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex items-center space-x-3 flex-wrap gap-y-2">
                    <label class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl cursor-pointer transition text-sm font-semibold shadow-sm flex items-center space-x-2">
                        <span>📥 匯入 Excel 寬表</span>
                        <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="importExcel(event)">
                    </label>
                    <button onclick="downloadTemplate()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2.5 rounded-xl transition text-sm font-semibold shadow-sm">📥 下載測試範例</button>
                    <button onclick="exportExcel()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl transition text-sm font-semibold shadow-sm">📤 匯出資料</button>
                    <button onclick="loadSampleData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl transition text-sm font-semibold">🔄 載入預設數據</button>
                </div>
                <div id="status-msg" class="text-xs text-emerald-600 font-medium"></div>
            </div>

            <!-- 各部門分頁導覽列 (Tabs) -->
            <div class="flex space-x-2 border-b border-slate-200 overflow-x-auto pb-2" id="department-tabs">
                <!-- 動態生成部門標籤與設定頁標籤 -->
            </div>

            <!-- 全螢幕部門獨立視圖與分析 -->
            <div id="department-fullscreen-view" class="space-y-6">
                <!-- 動態渲染當前部門圖表與數據分析或設定頁面 -->
            </div>
        </main>
    </div>

    <!-- Firebase SDK & 邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4C6e60S9qHXfN2XJ6WrMz2WLEgUG7mf0",
            authDomain: "laborhour-62067.firebaseapp.com",
            databaseURL: "https://laborhour-62067-default-rtdb.firebaseio.com",
            projectId: "laborhour-62067",
            storageBucket: "laborhour-62067.firebasestorage.app",
            messagingSenderId: "1022402354215",
            appId: "1:1022402354215:web:812f44fe1ee895ebdb0202",
            measurementId: "G-EC67Q7P1FS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let activeChart = null;
        let globalData = [];
        let currentTab = '';

        let utilFactorMap = {
            'metal-1': 0.81, 'metal-2': 0.82, 'metal-3': 0.79, 'lathe': 0.85, 'post treat': 0.89,
            'clean': 0.87, 'assembly': 0.81, 'edm': 0.79, 'grinding': 0.84, 'graphite': 0.89,
            'package': 0.88, 'inspection': 0.86, 'lapping': 0.81, 'enp': 0.75, 'coating': 0.71,
            'welding': 0.61, 'leaktest': 0.62, 'anodizing': 0.68, 'passivation': 0.69, 'ep': 0.67
        };

        const sampleRawData = [
            { month: 'Jan-25', department: 'metal-1', hours: 18211 }, { month: 'Feb-25', department: 'metal-1', hours: 6475 }, { month: 'Mar-25', department: 'metal-1', hours: 7333 }, { month: 'Apr-25', department: 'metal-1', hours: 18035 }, { month: 'May-25', department: 'metal-1', hours: 7387 }, { month: 'Jun-25', department: 'metal-1', hours: 8642 },
            { month: 'Jan-25', department: 'metal-2', hours: 11841 }, { month: 'Feb-25', department: 'metal-2', hours: 8641 }, { month: 'Mar-25', department: 'metal-2', hours: 3842 }, { month: 'Apr-25', department: 'metal-2', hours: 14206 }, { month: 'May-25', department: 'metal-2', hours: 14869 }, { month: 'Jun-25', department: 'metal-2', hours: 12335 },
            { month: 'Jan-25', department: 'metal-3', hours: 16702 }, { month: 'Feb-25', department: 'metal-3', hours: 18020 }, { month: 'Mar-25', department: 'metal-3', hours: 18674 }, { month: 'Apr-25', department: 'metal-3', hours: 14188 }, { month: 'May-25', department: 'metal-3', hours: 13646 }, { month: 'Jun-25', department: 'metal-3', hours: 5753 },
            { month: 'Jan-25', department: 'lathe', hours: 6821 }, { month: 'Feb-25', department: 'lathe', hours: 6332 }, { month: 'Mar-25', department: 'lathe', hours: 3897 }, { month: 'Apr-25', department: 'lathe', hours: 12695 }, { month: 'May-25', department: 'lathe', hours: 10128 }, { month: 'Jun-25', department: 'lathe', hours: 8197 },
            { month: 'Jan-25', department: 'post treat', hours: 15415 }, { month: 'Feb-25', department: 'post treat', hours: 10277 }, { month: 'Mar-25', department: 'post treat', hours: 17769 }, { month: 'Apr-25', department: 'post treat', hours: 7559 }, { month: 'May-25', department: 'post treat', hours: 10738 }, { month: 'Jun-25', department: 'post treat', hours: 5174 }
        ];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-display').textContent = `使用者: ${user.email || '示範訪客'}`;
                loadDataFromCloud();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        window.handleLogin = async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorDiv.classList.add('hidden');
            } catch (error) {
                errorDiv.textContent = `登入失敗: ${error.message}`;
                errorDiv.classList.remove('hidden');
            }
        };

        window.handleDemoLogin = async () => {
            try {
                await signInAnonymously(auth);
            } catch (err) {
                console.warn("匿名登入失敗:", err);
            }
        };

        window.handleLogout = () => {
            signOut(auth);
        };

        async function loadDataFromCloud() {
            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, 'labor_hours_system'));
                
                if (snapshot.exists()) {
                    const dataObj = snapshot.val();
                    if (dataObj.lastUpdated) {
                        document.getElementById('last-update-time').textContent = `最後更新: ${dataObj.lastUpdated}`;
                    }
                    if (dataObj.factors) {
                        utilFactorMap = { ...utilFactorMap, ...dataObj.factors };
                    }
                    if (dataObj.records && Array.isArray(dataObj.records)) {
                        globalData = dataObj.records;
                        initDashboard(globalData);
                        return;
                    }
                }
                globalData = sampleRawData;
                initDashboard(globalData);
            } catch (e) {
                console.warn("載入雲端失敗，使用範例數據:", e);
                globalData = sampleRawData;
                initDashboard(globalData);
            }
        }

        window.loadSampleData = async () => {
            globalData = sampleRawData;
            initDashboard(globalData);
            document.getElementById('status-msg').textContent = "已載入預設示範數據";
            await saveToCloud(sampleRawData, utilFactorMap);
        };

        async function saveToCloud(records, factors) {
            try {
                const now = new Date();
                const timeString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
                await set(ref(db, 'labor_hours_system'), {
                    lastUpdated: timeString,
                    records: records,
                    factors: factors
                });
                document.getElementById('last-update-time').textContent = `最後更新: ${timeString}`;
            } catch (err) {
                console.warn("同步雲端失敗:", err);
            }
        }

        function initDashboard(data) {
            const departments = [...new Set(data.map(item => item.department))];
            if (departments.length === 0) return;

            if (!currentTab || (!departments.includes(currentTab) && currentTab !== 'SETTINGS')) {
                currentTab = departments[0];
            }

            renderTabs(departments);
            
            if (currentTab === 'SETTINGS') {
                renderSettingsView(departments);
            } else {
                renderDepartmentFullscreenView(currentTab, data);
            }
        }

        function renderTabs(departments) {
            const tabsContainer = document.getElementById('department-tabs');
            tabsContainer.innerHTML = '';

            departments.forEach(dept => {
                const isActive = dept === currentTab;
                const btn = document.createElement('button');
                btn.className = `px-6 py-3 font-semibold text-sm rounded-xl transition whitespace-nowrap ${isActive ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`;
                btn.textContent = `📊 ${dept}`;
                btn.onclick = () => {
                    currentTab = dept;
                    renderTabs(departments);
                    renderDepartmentFullscreenView(dept, globalData);
                };
                tabsContainer.appendChild(btn);
            });

            const isSettingsActive = currentTab === 'SETTINGS';
            const settingsBtn = document.createElement('button');
            settingsBtn.className = `px-6 py-3 font-semibold text-sm rounded-xl transition whitespace-nowrap ${isSettingsActive ? 'bg-amber-600 text-white shadow-md shadow-amber-600/20' : 'bg-amber-50 text-amber-800 hover:bg-amber-100 border border-amber-200'}`;
            settingsBtn.textContent = `⚙️ 權重參數設定`;
            settingsBtn.onclick = () => {
                currentTab = 'SETTINGS';
                renderTabs(departments);
                renderSettingsView(departments);
            };
            tabsContainer.appendChild(settingsBtn);
        }

        function renderSettingsView(departments) {
            const container = document.getElementById('department-fullscreen-view');
            
            departments.forEach(dept => {
                const key = dept.toLowerCase();
                if (utilFactorMap[key] === undefined) {
                    utilFactorMap[key] = 0.80;
                }
            });

            let rowsHTML = departments.map(dept => {
                const key = dept.toLowerCase();
                const factorVal = utilFactorMap[key] !== undefined ? utilFactorMap[key] : 0.80;
                return `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="py-3 px-4 font-bold text-slate-800">${dept}</td>
                        <td class="py-3 px-4">
                            <input type="number" step="0.01" min="0" max="2" value="${factorVal}" data-dept="${key}" class="factor-input w-32 px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </td>
                        <td class="py-3 px-4 text-sm text-slate-500 font-mono">
                            ${(factorVal * 100).toFixed(0)}%
                        </td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6 max-w-4xl mx-auto">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                        <div>
                            <span class="text-xs font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full uppercase tracking-wider">Utilization Weight Configuration</span>
                            <h3 class="text-2xl font-black text-slate-900 mt-2">⚙️ 各部門稼動率權重係數設定</h3>
                            <p class="text-xs text-slate-500 mt-1">計算公式：[該月報工工時 / 區間最大工時] × 權重係數</p>
                        </div>
                        <button onclick="saveFactors()" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2.5 rounded-xl transition text-sm font-bold shadow-md shadow-amber-600/20 flex items-center space-x-2">
                            <span>💾 儲存權重設定</span>
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 text-xs uppercase tracking-wider font-bold">
                                    <th class="py-3 px-4 rounded-l-lg">部門代號 (Department)</th>
                                    <th class="py-3 px-4">權重係數 (Factor)</th>
                                    <th class="py-3 px-4 rounded-r-lg">基準換算比例</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHTML}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.saveFactors = async () => {
            const inputs = document.querySelectorAll('.factor-input');
            inputs.forEach(input => {
                const deptKey = input.getAttribute('data-dept');
                const val = parseFloat(input.value);
                if (!isNaN(val)) {
                    utilFactorMap[deptKey] = val;
                }
            });

            await saveToCloud(globalData, utilFactorMap);
            document.getElementById('status-msg').textContent = '✅ 權重設定已成功更新並同步至雲端！';
            setTimeout(() => { document.getElementById('status-msg').textContent = ''; }, 3000);
        };

        function renderDepartmentFullscreenView(dept, data) {
            const months = [...new Set(data.map(item => item.month))];
            const deptRecords = data.filter(item => item.department === dept);
            
            const deptData = months.map(m => {
                const found = deptRecords.find(item => item.month === m);
                return found ? Number(found.hours) : 0;
            });

            const totalHours = deptData.reduce((a, b) => a + b, 0);
            const avgHours = Math.round(totalHours / (months.length || 1));
            const maxHours = Math.max(...deptData);
            const minHours = Math.min(...deptData);
            const maxMonth = months[deptData.indexOf(maxHours)] || '-';
            const minMonth = months[deptData.indexOf(minHours)] || '-';

            const factor = utilFactorMap[dept.toLowerCase()] !== undefined ? utilFactorMap[dept.toLowerCase()] : 0.80;
            const utilizationData = deptData.map(hours => {
                if (maxHours === 0) return 0;
                return Number(((hours / maxHours) * factor * 100).toFixed(1));
            });

            const avgUtil = utilizationData.length > 0 ? (utilizationData.reduce((a, b) => a + b, 0) / utilizationData.length).toFixed(1) : '0';

            // --- 計算近 3 個月稼動率分析 ---
            const recent3Months = months.slice(-3);
            const recent3Util = utilizationData.slice(-3);
            const recent3AvgUtil = recent3Util.length > 0 ? (recent3Util.reduce((a, b) => a + b, 0) / recent3Util.length).toFixed(1) : '0';
            
            let trendText = '';
            let trendBadgeClass = '';
            let diffVal = 0;

            if (recent3Util.length >= 2) {
                const first = recent3Util[0];
                const last = recent3Util[recent3Util.length - 1];
                diffVal = (last - first).toFixed(1);
                
                if (diffVal > 5) {
                    trendText = `📈 近 3 個月稼動率呈現強勁上升趨勢（增加 ${diffVal}%），產能利用率持續顯著提升。`;
                    trendBadgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
                } else if (diffVal < -5) {
                    trendText = `📉 近 3 個月稼動率呈下降趨勢（減少 ${Math.abs(diffVal)}%），建議關注設備及人力排班調配。`;
                    trendBadgeClass = 'bg-rose-100 text-rose-800 border-rose-300';
                } else {
                    trendText = `➡️ 近 3 個月稼動率維持平穩波動（微幅變化 ${diffVal > 0 ? '+' : ''}${diffVal}%），運作狀態良好。`;
                    trendBadgeClass = 'bg-blue-100 text-blue-800 border-blue-300';
                }
            } else {
                trendText = `📊 近 3 個月平均稼動率為 ${recent3AvgUtil}%。`;
                trendBadgeClass = 'bg-slate-100 text-slate-800 border-slate-300';
            }

            const recentMonthsDetailHTML = recent3Months.map((m, idx) => `
                <div class="flex flex-col bg-slate-50 border border-slate-200 p-3 rounded-xl text-center">
                    <span class="text-xs font-bold text-slate-500">${m}</span>
                    <span class="text-lg font-black text-indigo-700 mt-0.5">${recent3Util[idx]}%</span>
                </div>
            `).join('');

            const container = document.getElementById('department-fullscreen-view');
            container.innerHTML = `
                <!-- 頂部重點 KPI 卡片 -->
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">部門累計總工時</span>
                        <h4 class="text-2xl font-black text-slate-900 mt-1">${totalHours.toLocaleString()} <span class="text-sm font-normal text-slate-500">Hrs</span></h4>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">月平均工時</span>
                        <h4 class="text-2xl font-black text-blue-700 mt-1">${avgHours.toLocaleString()} <span class="text-sm font-normal text-slate-500">Hrs</span></h4>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">全期平均稼動率</span>
                        <h4 class="text-2xl font-black text-indigo-700 mt-1">${avgUtil}%</h4>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">最高峰月份 (${maxMonth})</span>
                        <h4 class="text-2xl font-black text-emerald-700 mt-1">${maxHours.toLocaleString()} <span class="text-sm font-normal text-slate-500">Hrs</span></h4>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">最低谷月份 (${minMonth})</span>
                        <h4 class="text-2xl font-black text-amber-700 mt-1">${minHours.toLocaleString()} <span class="text-sm font-normal text-slate-500">Hrs</span></h4>
                    </div>
                </div>

                <!-- 🌟 圖表上方新增：近 3 個月稼動率專屬分析卡片 -->
                <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white p-6 rounded-2xl shadow-md border border-indigo-900 space-y-4">
                    <div class="flex justify-between items-center flex-wrap gap-3">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-600 text-white p-2 rounded-xl text-lg font-bold">🔍</span>
                            <div>
                                <h4 class="text-lg font-bold tracking-wide">${dept} - 近 3 個月稼動率趨勢分析</h4>
                                <p class="text-xs text-indigo-200">分析區間: ${recent3Months.join(', ')}</p>
                            </div>
                        </div>
                        <div class="bg-indigo-900/80 px-4 py-2 rounded-xl border border-indigo-700 text-center">
                            <span class="text-xs text-indigo-200 uppercase tracking-wider block font-semibold">近 3 個月平均稼動率</span>
                            <span class="text-2xl font-black text-amber-300">${recent3AvgUtil}%</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                        <!-- 月份個別數據 -->
                        <div class="md:col-span-2 grid grid-cols-3 gap-2">
                            ${recentMonthsDetailHTML}
                        </div>
                        <!-- 分析診斷點評 -->
                        <div class="md:col-span-2 p-3.5 bg-white/10 rounded-xl border border-white/10 backdrop-blur">
                            <div class="inline-block px-2.5 py-0.5 rounded-full text-xs font-extrabold border mb-1.5 ${trendBadgeClass}">
                                診斷評估
                            </div>
                            <p class="text-sm font-medium leading-relaxed text-slate-100">${trendText}</p>
                        </div>
                    </div>
                </div>

                <!-- 主要分析圖表區 -->
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                    <div class="flex justify-between items-center flex-wrap gap-4 border-b border-slate-100 pb-4">
                        <div>
                            <span class="text-xs font-bold text-blue-700 bg-blue-100 px-3 py-1 rounded-full uppercase tracking-wider">Department Fullscreen Analytics</span>
                            <h3 class="text-2xl font-black text-slate-900 mt-2">${dept} - 跨年月工時與稼動率分析</h3>
                        </div>
                        
                        <!-- 控制按鈕區：工時隱藏、稼動率隱藏、下載 PNG -->
                        <div class="flex items-center space-x-3 flex-wrap gap-y-2">
                            <label class="flex items-center space-x-2 bg-blue-50 border border-blue-200 text-blue-900 px-4 py-2 rounded-xl text-sm font-bold cursor-pointer hover:bg-blue-100 transition">
                                <input type="checkbox" id="toggle-hours-cb" checked onchange="toggleDataset(0, this.checked)" class="w-4 h-4 text-blue-600 rounded">
                                <span>顯示工時折線</span>
                            </label>

                            <label class="flex items-center space-x-2 bg-indigo-50 border border-indigo-200 text-indigo-900 px-4 py-2 rounded-xl text-sm font-bold cursor-pointer hover:bg-indigo-100 transition">
                                <input type="checkbox" id="toggle-util-cb" checked onchange="toggleDataset(1, this.checked)" class="w-4 h-4 text-indigo-600 rounded">
                                <span>顯示稼動率柱狀圖</span>
                            </label>

                            <button onclick="downloadChartPNG()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2 rounded-xl transition text-sm font-bold shadow-sm flex items-center space-x-2">
                                <span>📸 匯出白底高畫質 PNG</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 圖表 Canvas -->
                    <div class="relative w-full h-[500px] bg-white p-4 rounded-xl border border-slate-100">
                        <canvas id="fullscreenChart"></canvas>
                    </div>
                </div>
            `;

            // Canvas 純白背景 Plugin 確保匯出的圖表不為黑色或透明
            const whiteBackgroundPlugin = {
                id: 'customCanvasBackgroundColor',
                beforeDraw: (chart) => {
                    const { ctx, width, height } = chart;
                    ctx.save();
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.restore();
                }
            };

            const ctx = document.getElementById('fullscreenChart').getContext('2d');
            if (activeChart) activeChart.destroy();

            activeChart = new Chart(ctx, {
                plugins: [whiteBackgroundPlugin],
                data: {
                    labels: months,
                    datasets: [
                        {
                            type: 'line',
                            label: `${dept} 報工工時 (Hrs)`,
                            data: deptData,
                            borderColor: '#1d4ed8',
                            backgroundColor: 'rgba(29, 78, 216, 0.1)',
                            borderWidth: 4,
                            fill: false,
                            tension: 0.2,
                            pointRadius: 7,
                            pointHoverRadius: 10,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#1d4ed8',
                            pointBorderWidth: 4,
                            yAxisID: 'y',
                            order: 1
                        },
                        {
                            type: 'bar',
                            label: `${dept} 稼動率 (%)`,
                            data: utilizationData,
                            backgroundColor: 'rgba(79, 70, 229, 0.85)',
                            borderColor: '#3730a3',
                            borderWidth: 2,
                            borderRadius: 6,
                            barPercentage: 0.45,
                            yAxisID: 'y1',
                            order: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: { size: 14, weight: '800' },
                                color: '#0f172a',
                                usePointStyle: true,
                                padding: 25
                            }
                        },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleFont: { size: 15, weight: 'bold' },
                            bodyFont: { size: 14, weight: '600' },
                            padding: 14,
                            cornerRadius: 10,
                            callbacks: {
                                label: function(context) {
                                    if (context.dataset.yAxisID === 'y1') {
                                        return `${context.dataset.label}: ${context.raw}%`;
                                    }
                                    return `${context.dataset.label}: ${context.raw.toLocaleString()} Hrs`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            beginAtZero: true,
                            grid: { color: '#e2e8f0', lineWidth: 1.5 },
                            ticks: { font: { size: 14, weight: '700' }, color: '#1d4ed8' },
                            title: { display: true, text: '工時 (Hours)', color: '#1d4ed8', font: { weight: '800', size: 14 } }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            beginAtZero: true,
                            max: 100,
                            grid: { drawOnChartArea: false },
                            ticks: { 
                                font: { size: 14, weight: '700' }, 
                                color: '#3730a3',
                                callback: function(value) { return value + '%'; }
                            },
                            title: { display: true, text: '稼動率 (%)', color: '#3730a3', font: { weight: '800', size: 14 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 14, weight: '700' }, color: '#0f172a' },
                            title: { display: true, text: '月份', color: '#0f172a', font: { weight: '800', size: 14 } }
                        }
                    }
                }
            });
        }

        window.toggleDataset = (datasetIndex, visible) => {
            if (!activeChart) return;
            activeChart.setDatasetVisibility(datasetIndex, visible);
            
            if (datasetIndex === 0) {
                activeChart.options.scales.y.display = visible;
            } else if (datasetIndex === 1) {
                activeChart.options.scales.y1.display = visible;
            }
            
            activeChart.update();
        };

        window.downloadChartPNG = () => {
            const canvas = document.getElementById('fullscreenChart');
            if (!canvas) return;
            
            const imageURL = canvas.toDataURL('image/png', 1.0);
            const link = document.createElement('a');
            link.download = `${currentTab}_Labor_Hours_Utilization_Trend.png`;
            link.href = imageURL;
            link.click();
        };

        window.downloadTemplate = () => {
            const templateData = [
                { dep: 'metal-1', 'Jan-25': 18211, 'Feb-25': 6475, 'Mar-25': 7333, 'Apr-25': 18035 },
                { dep: 'metal-2', 'Jan-25': 11841, 'Feb-25': 8641, 'Mar-25': 3842, 'Apr-25': 14206 },
                { dep: 'metal-3', 'Jan-25': 16702, 'Feb-25': 18020, 'Mar-25': 18674, 'Apr-25': 14188 },
                { dep: 'lathe', 'Jan-25': 6821, 'Feb-25': 6332, 'Mar-25': 3897, 'Apr-25': 12695 },
                { dep: 'post treat', 'Jan-25': 15415, 'Feb-25': 10277, 'Mar-25': 17769, 'Apr-25': 7559 }
            ];
            const ws = XLSX.utils.json_to_sheet(templateData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "LaborHours");
            XLSX.writeFile(wb, "Test_Labor_Hours_Template.xlsx");
        };

        function parseExcelDate(serial) {
            if (typeof serial === 'number' && serial > 30000 && serial < 60000) {
                const utc_days = Math.floor(serial - 25569);
                const dateObj = new Date(utc_days * 86400 * 1000);
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const mStr = months[dateObj.getUTCMonth()];
                const yStr = String(dateObj.getUTCFullYear()).slice(-2);
                return `${mStr}-${yStr}`;
            }
            return String(serial).trim();
        }

        window.importExcel = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    
                    if (rows.length < 2) {
                        alert("Excel 檔案內容不足！");
                        return;
                    }

                    let headerIndex = 0;
                    for (let i = 0; i < rows.length; i++) {
                        if (rows[i] && rows[i].some(cell => cell && String(cell).toLowerCase().includes('dep'))) {
                            headerIndex = i;
                            break;
                        }
                    }

                    const headers = rows[headerIndex];
                    const parsedData = [];

                    for (let i = headerIndex + 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length === 0) continue;
                        const department = row[0];
                        if (!department) continue;

                        for (let j = 1; j < headers.length; j++) {
                            const rawMonth = headers[j];
                            const hours = row[j];
                            if (rawMonth !== undefined && rawMonth !== null && hours !== undefined && hours !== null && !isNaN(hours)) {
                                const month = parseExcelDate(rawMonth);
                                parsedData.push({
                                    month: month,
                                    department: String(department).trim(),
                                    hours: Number(hours)
                                });
                            }
                        }
                    }

                    if (parsedData.length === 0) {
                        alert("無法解析 Excel 資料，請確認第一欄為部門代號！");
                        return;
                    }

                    globalData = parsedData;
                    await saveToCloud(parsedData, utilFactorMap);
                    initDashboard(globalData);
                    document.getElementById('status-msg').textContent = `成功匯入並同步 ${parsedData.length} 筆記錄！`;
                    document.getElementById('excel-file-input').value = '';
                } catch (err) {
                    console.error(err);
                    alert("Excel 解析失敗，請確認檔案格式是否正確。");
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.exportExcel = async () => {
            if (globalData.length === 0) {
                alert("目前無資料可供匯出！");
                return;
            }

            const departments = [...new Set(globalData.map(item => item.department))];
            const months = [...new Set(globalData.map(item => item.month))];

            const exportData = departments.map(dept => {
                const row = { dep: dept };
                months.forEach(m => {
                    const record = globalData.find(item => item.department === dept && item.month === m);
                    row[m] = record ? record.hours : 0;
                });
                return row;
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "LaborHours");
            XLSX.writeFile(workbook, "Enterprise_Labor_Hours.xlsx");
        };
    </script>
</body>
</html>
