<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labor Hours Trend - 製造工時趨勢系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- 登入畫面 (未登入時顯示) -->
    <div id="login-section" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">製造工時系統登入</h2>
            <div id="login-error" class="mb-4 text-red-500 text-sm hidden"></div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">電子郵件</label>
                <input type="email" id="login-email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="user@example.com">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">密碼</label>
                <input type="password" id="login-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">登入系統</button>
        </div>
    </div>

    <!-- 主控台畫面 (登入後顯示) -->
    <div id="app-section" class="hidden flex-grow flex flex-col">
        <!-- 導覽列 -->
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Labor Hours Trend (製造工時趨勢)</h1>
            <div class="flex items-center space-x-4">
                <span id="user-display" class="text-sm text-gray-600"></span>
                <button onclick="handleLogout()" class="bg-red-500 text-white text-sm px-3 py-1.5 rounded-lg hover:bg-red-600 transition">登出</button>
            </div>
        </header>

        <!-- 主要內容 -->
        <main class="flex-grow p-6 max-w-7xl mx-auto w-full space-y-6">
            <!-- 功能按鈕列 -->
            <div class="bg-white p-4 rounded-xl shadow flex flex-wrap gap-4 items-center justify-between">
                <div class="flex items-center space-x-3">
                    <label class="bg-green-600 text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-green-700 transition text-sm font-medium">
                        匯入 Excel
                        <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
                    </label>
                    <button onclick="exportExcel()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium">匯出 Excel</button>
                </div>
                <div class="text-sm text-gray-500">提示：Excel 格式需包含欄位 [月份, 課別, 工時]</div>
            </div>

            <!-- 圖表區塊 -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-lg font-bold text-gray-800 mb-4">各課別每月工時趨勢</h3>
                <div class="relative h-80">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // TODO: 請替換為您自己的 Firebase 專案設定
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let myChart = null;

        // 監聽登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-display').textContent = `使用者: ${user.email}`;
                loadDataAndRenderChart();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        window.handleLogin = async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorDiv.classList.add('hidden');
            } catch (error) {
                errorDiv.textContent = `登入失敗: ${error.message}`;
                errorDiv.classList.remove('hidden');
            }
        };

        window.handleLogout = () => {
            signOut(auth);
        };

        // 從 Firestore 讀取資料並渲染圖表
        async function loadDataAndRenderChart() {
            try {
                const querySnapshot = await getDocs(collection(db, "labor_hours"));
                const rawData = [];
                querySnapshot.forEach((doc) => {
                    rawData.push(doc.data());
                });

                // 若雲端無資料，給予預設範例資料
                if (rawData.length === 0) {
                    renderChart([
                        { month: '1月', department: '生管課', hours: 160 },
                        { month: '1月', department: '加工課', hours: 320 },
                        { month: '1月', department: '組裝課', hours: 280 }
                    ]);
                    return;
                }
                renderChart(rawData);
            } catch (e) {
                console.error("載入失敗: ", e);
            }
        }

        // 渲染 Chart.js 折線圖
        function renderChart(data) {
            const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            const departments = [...new Set(data.map(item => item.department))];

            const datasets = departments.map((dept, index) => {
                const colors = ['#4C72B0', '#DD8452', '#55A868', '#C44E52', '#8172B3'];
                const deptData = months.map(m => {
                    const found = data.find(item => item.month === m && item.department === dept);
                    return found ? found.hours : 0;
                });
                return {
                    label: dept,
                    data: deptData,
                    borderColor: colors[index % colors.length],
                    backgroundColor: colors[index % colors.length],
                    borderWidth: 2,
                    tension: 0.1
                };
            });

            const ctx = document.getElementById('trendChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: months, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        // 匯入 Excel 並上傳至 Firestore
        window.importExcel = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                    // 批次寫入 Firestore
                    for (let row of jsonData) {
                        // 假設 excel 欄位為: month, department, hours
                        const docId = `${row.month}_${row.department}`;
                        await setDoc(doc(db, "labor_hours", docId), {
                            month: String(row.month),
                            department: String(row.department),
                            hours: Number(row.hours)
                        });
                    }
                    alert("Excel 資料匯入並同步至雲端成功！");
                    loadDataAndRenderChart();
                } catch (err) {
                    console.error(err);
                    alert("匯入失敗，請確認 Excel 格式是否正確（需包含 month, department, hours 欄位）。");
                }
            };
            reader.readAsArrayBuffer(file);
        };

        // 匯出 Excel
        window.exportExcel = async () => {
            const querySnapshot = await getDocs(collection(db, "labor_hours"));
            const data = [];
            querySnapshot.forEach((doc) => {
                data.push(doc.data());
            });

            if (data.length === 0) {
                alert("目前無資料可供匯出！");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, "LaborHours", worksheet);
            XLSX.writeFile(workbook, "Labor_Hours_Trend.xlsx");
        };
    </script>
</body>
</html>
