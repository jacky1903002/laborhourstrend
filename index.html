<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Labor Hours Trend Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800">

    <!-- 登入畫面 -->
    <div id="login-section" class="flex-grow flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900">
        <div class="bg-white/95 backdrop-blur p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 text-white rounded-xl font-bold text-xl mb-3 shadow-lg shadow-blue-500/30">LT</div>
                <h2 class="text-2xl font-bold text-slate-900">製造工時趨勢系統</h2>
                <p class="text-sm text-slate-500 mt-1">Enterprise Labor Hours Intelligence</p>
            </div>
            
            <div id="login-error" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg hidden"></div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-slate-700 text-xs font-semibold uppercase tracking-wider mb-1.5">電子郵件</label>
                    <input type="email" id="login-email" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="user@feedback.com.tw">
                </div>
                <div>
                    <label class="block text-slate-700 text-xs font-semibold uppercase tracking-wider mb-1.5">密碼</label>
                    <input type="password" id="login-password" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-blue-600/20 text-sm">安全登入</button>
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase">或</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>
                <button onclick="handleGuestLogin()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-xl transition text-sm">快速演示登入 (免帳號)</button>
            </div>
        </div>
    </div>

    <!-- 主控台畫面 -->
    <div id="app-section" class="hidden flex-grow flex flex-col">
        <!-- 企業頂部導覽列 -->
        <header class="bg-slate-900 text-white shadow-md px-8 py-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center space-x-4">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-bold shadow">LT</div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">Labor Hours Trend Analytics</h1>
                    <span id="last-update-time" class="text-xs text-slate-400 font-mono">最後更新: 載入中...</span>
                </div>
            </div>
            <div class="flex items-center space-x-6">
                <span id="user-display" class="text-sm text-slate-300 font-medium"></span>
                <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-red-400 text-sm px-4 py-2 rounded-xl transition border border-slate-700">登出系統</button>
            </div>
        </header>

        <!-- 主要內容區 -->
        <main class="flex-grow p-8 max-w-7xl mx-auto w-full space-y-8">
            <!-- 工具列與操作區 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex items-center space-x-3">
                    <label class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl cursor-pointer transition text-sm font-semibold shadow-sm flex items-center space-x-2">
                        <span>📥 匯入 Excel 寬表</span>
                        <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
                    </label>
                    <button onclick="exportExcel()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl transition text-sm font-semibold shadow-sm">📤 匯出資料</button>
                    <button onclick="loadSampleData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl transition text-sm font-semibold">🔄 載入預設示範數據</button>
                </div>
                <div id="status-msg" class="text-xs text-blue-600 font-medium"></div>
            </div>

            <!-- 總覽 KPI 摘要卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">監控部門總數</p>
                    <h3 id="kpi-dep-count" class="text-3xl font-bold text-slate-900 mt-2">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">資料月份跨度</p>
                    <h3 id="kpi-month-range" class="text-3xl font-bold text-blue-600 mt-2">0 個月</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">全廠累計總工時</p>
                    <h3 id="kpi-total-hours" class="text-3xl font-bold text-emerald-600 mt-2">0 Hrs</h3>
                </div>
            </div>

            <!-- 各部門獨立全螢幕折線趨勢圖容器 -->
            <div id="department-charts-container" class="space-y-8">
                <!-- 動態生成各部門圖表 -->
            </div>
        </main>
    </div>

    <!-- Firebase SDK & 商業化繪圖邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, setDoc, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4C6e60S9qHXfN2XJ6WrMz2WLEgUG7mf0",
            authDomain: "laborhour-62067.firebaseapp.com",
            databaseURL: "https://laborhour-62067-default-rtdb.firebaseio.com",
            projectId: "laborhour-62067",
            storageBucket: "laborhour-62067.firebasestorage.app",
            messagingSenderId: "1022402354215",
            appId: "1:1022402354215:web:812f44fe1ee895ebdb0202",
            measurementId: "G-EC67Q7P1FS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let chartInstances = {};

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-display').textContent = `使用者: ${user.email || '訪客模式 (Guest)'}`;
                loadDataAndRenderCharts();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        window.handleLogin = async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorDiv.classList.add('hidden');
            } catch (error) {
                errorDiv.textContent = `登入失敗: ${error.message} (建議點選下方快速演示登入)`;
                errorDiv.classList.remove('hidden');
            }
        };

        window.handleGuestLogin = async () => {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("匿名登入失敗:", error);
            }
        };

        window.handleLogout = () => {
            signOut(auth);
        };

        const sampleRawData = [
            { month: 'Jan-25', department: 'metal-1', hours: 18211 }, { month: 'Feb-25', department: 'metal-1', hours: 6475 }, { month: 'Mar-25', department: 'metal-1', hours: 7333 }, { month: 'Apr-25', department: 'metal-1', hours: 18035 },
            { month: 'Jan-25', department: 'metal-2', hours: 11841 }, { month: 'Feb-25', department: 'metal-2', hours: 8641 }, { month: 'Mar-25', department: 'metal-2', hours: 3842 }, { month: 'Apr-25', department: 'metal-2', hours: 14206 },
            { month: 'Jan-25', department: 'metal-3', hours: 16702 }, { month: 'Feb-25', department: 'metal-3', hours: 18020 }, { month: 'Mar-25', department: 'metal-3', hours: 18674 }, { month: 'Apr-25', department: 'metal-3', hours: 14188 },
            { month: 'Jan-25', department: 'lathe', hours: 6821 }, { month: 'Feb-25', department: 'lathe', hours: 6332 }, { month: 'Mar-25', department: 'lathe', hours: 3897 }, { month: 'Apr-25', department: 'lathe', hours: 12695 },
            { month: 'Jan-25', department: 'post treat', hours: 15415 }, { month: 'Feb-25', department: 'post treat', hours: 10277 }, { month: 'Mar-25', department: 'post treat', hours: 17769 }, { month: 'Apr-25', department: 'post treat', hours: 7559 }
        ];

        async function loadDataAndRenderCharts() {
            try {
                const metaDoc = await getDoc(doc(db, "metadata", "status"));
                if (metaDoc.exists() && metaDoc.data().lastUpdated) {
                    document.getElementById('last-update-time').textContent = `最後更新: ${metaDoc.data().lastUpdated}`;
                } else {
                    document.getElementById('last-update-time').textContent = '最後更新: 尚未更新';
                }

                const querySnapshot = await getDocs(collection(db, "labor_hours"));
                const rawData = [];
                querySnapshot.forEach((docItem) => {
                    rawData.push(docItem.data());
                });

                if (rawData.length === 0) {
                    renderAllDepartments(sampleRawData);
                    return;
                }
                renderAllDepartments(rawData);
            } catch (e) {
                console.error("載入失敗，採用示範資料: ", e);
                renderAllDepartments(sampleRawData);
            }
        }

        window.loadSampleData = () => {
            renderAllDepartments(sampleRawData);
            document.getElementById('status-msg').textContent = "已載入預設示範數據";
        };

        function renderAllDepartments(data) {
            const months = [...new Set(data.map(item => item.month))];
            const departments = [...new Set(data.map(item => item.department))];

            document.getElementById('kpi-dep-count').textContent = departments.length;
            document.getElementById('kpi-month-range').textContent = `${months.length} 個月`;
            
            const totalHours = data.reduce((sum, item) => sum + (Number(item.hours) || 0), 0);
            document.getElementById('kpi-total-hours').textContent = totalHours.toLocaleString() + ' Hrs';

            const container = document.getElementById('department-charts-container');
            container.innerHTML = '';

            Object.values(chartInstances).forEach(chart => chart.destroy());
            chartInstances = {};

            const departmentColors = {
                'metal-1': '#2563eb',
                'metal-2': '#7c3aed',
                'metal-3': '#059669',
                'lathe': '#d97706',
                'post treat': '#dc2626'
            };

            departments.forEach((dept, index) => {
                const deptData = months.map(m => {
                    const found = data.find(item => item.month === m && item.department === dept);
                    return found ? found.hours : 0;
                });

                const canvasId = `chart-dept-${index}`;

                const cardHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-wider">Department Profile</span>
                                <h3 class="text-xl font-bold text-slate-900 mt-2">${dept}</h3>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-slate-400">累計工時</span>
                                <p class="text-lg font-bold text-slate-700">${deptData.reduce((a,b)=>a+b,0).toLocaleString()} Hrs</p>
                            </div>
                        </div>
                        <div class="relative w-full h-80">
                            <canvas id="${canvasId}"></canvas>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);

                const ctx = document.getElementById(canvasId).getContext('2d');
                const mainColor = departmentColors[dept] || '#2563eb';

                chartInstances[dept] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [{
                            label: `${dept} - 報工工時趨勢`,
                            data: deptData,
                            borderColor: mainColor,
                            backgroundColor: mainColor + '15',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.2,
                            pointRadius: 5,
                            pointHoverRadius: 8,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: mainColor,
                            pointBorderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#1e293b',
                                titleFont: { size: 14, weight: 'bold' },
                                bodyFont: { size: 13 },
                                padding: 12,
                                cornerRadius: 8
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: '#f1f5f9' },
                                ticks: { font: { size: 12 }, color: '#64748b' },
                                title: { display: true, text: '工時 (Hours)', color: '#64748b', font: { weight: '600' } }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { font: { size: 12 }, color: '#64748b' }
                            }
                        }
                    }
                });
            });
        }

        window.importExcel = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read
