<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Labor Hours Trend Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800">

    <!-- 主控台畫面 -->
    <div id="app-section" class="flex-grow flex flex-col">
        <!-- 企業頂部導覽列 -->
        <header class="bg-slate-900 text-white shadow-md px-8 py-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center space-x-4">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-bold shadow">LT</div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">Enterprise Labor Hours Trend Analytics</h1>
                    <span id="last-update-time" class="text-xs text-slate-400 font-mono">最後更新: 載入中...</span>
                </div>
            </div>
            <div class="flex items-center space-x-6">
                <span class="text-sm text-emerald-400 font-medium">● Realtime DB 連線就緒</span>
            </div>
        </header>

        <!-- 主要內容區 -->
        <main class="flex-grow p-8 max-w-7xl mx-auto w-full space-y-8">
            <!-- 工具列與操作區 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex items-center space-x-3">
                    <label class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl cursor-pointer transition text-sm font-semibold shadow-sm flex items-center space-x-2">
                        <span>📥 匯入 Excel 寬表 (同步至 Realtime DB)</span>
                        <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
                    </label>
                    <button onclick="exportExcel()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl transition text-sm font-semibold shadow-sm">📤 匯出資料</button>
                    <button onclick="loadSampleData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl transition text-sm font-semibold">🔄 載入預設示範數據</button>
                </div>
                <div id="status-msg" class="text-xs text-emerald-600 font-medium"></div>
            </div>

            <!-- 總覽 KPI 摘要卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">監控部門總數</p>
                    <h3 id="kpi-dep-count" class="text-3xl font-bold text-slate-900 mt-2">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">資料月份跨度</p>
                    <h3 id="kpi-month-range" class="text-3xl font-bold text-blue-600 mt-2">0 個月
